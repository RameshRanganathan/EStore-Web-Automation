trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '6.0.x'

- task: NuGetToolInstaller@1
  displayName: 'Install NuGet'

- task: NuGetCommand@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    restoreSolution: '**/*.sln'

- task: DotNetBuild@2
  displayName: 'Build solution'
  inputs:
    projects: '**/*.sln'
    configuration: '$(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Run tests'
  inputs:
    command: 'test'
    projects: '**/*Tests.csproj'
    arguments: '--configuration $(buildConfiguration) --logger trx;LogFileName=test_results.trx'
    publishTestResults: true

- task: PublishTestResults@2
  displayName: 'Publish test results'
  inputs:
    testResultsFiles: '**/TestResults/*.trx'
    testRunTitle: 'Automation Test Results'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Extent Report'
  inputs:
    PathtoPublish: '**/ExtentReport.html'
    ArtifactName: 'ExtentReport'
    publishLocation: 'Container'
